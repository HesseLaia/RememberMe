name: Build Remember Me for GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'RememberMeUnity/**'
      - '.github/workflows/remember-me-web.yml'

concurrency:
  group: remember-me-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Unity Web player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: RememberMeUnity
          unityVersion: 6000.6.1f1
          targetPlatform: WebGL
          buildMethod: RememberMe.Editor.Act1Builder.BuildForGitHubPages
      - name: Verify publish directory
        run: |
          site=RememberMeUnity/Build/GitHubPages/docs
          test -s "$site/index.html"
          test -f "$site/.nojekyll"
          test -s "$site/Tinos-LICENSE.txt"
          find "$site/Build" -name '*.wasm.unityweb' -size +0c | grep -q .
      - uses: actions/upload-pages-artifact@v4
        with:
          path: RememberMeUnity/Build/GitHubPages/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

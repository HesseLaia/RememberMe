<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12201c">
  <title>Remember Me</title>
  <style>
    :root { color-scheme: dark; background: #111a17; color: #f4ead6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-content: center; font-family: Georgia, serif; padding: 12px; }
    main { width: min(1280px, calc(100vw - 24px), max(320px, (100dvh - 88px) * 1.6)); }
    header { margin-bottom: 8px; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 400; }
    canvas:focus-visible { outline: 2px solid #ebcf94; outline-offset: 2px; }
    #stage { position: relative; aspect-ratio: 8 / 5; background: #18231e; border: 1px solid #78664e; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #18231e; padding: 16px; text-align: center; }
    #loading[hidden] { display: none; }
    footer { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px 15px;
      margin-top: 10px; padding: 5px 12px; color: #d8cfbc; text-align: center;
      font: .8rem system-ui, sans-serif; }
    footer span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    kbd { border: 1px solid #8b826955; border-radius: 4px; padding: 1px 5px;
      background: #c9b99318; color: #f4ead6; font: 600 .76rem system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Remember Me</h1>
    </header>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="0" aria-label="Remember Me game"></canvas>
      <div id="loading" role="status" aria-live="polite">Loading Remember Me…</div>
    </div>
    <footer aria-label="Keyboard controls">
      <span><kbd>WASD</kbd> Move</span>
      <span><kbd>Shift</kbd> Run</span>
      <span><kbd>C</kbd> Crouch</span>
      <span><kbd>E</kbd> Interact</span>
      <span><kbd>Esc</kbd> Menu</span>
    </footer>
  </main>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const config = {
      dataUrl: 'Build/docs.data.unityweb',
      frameworkUrl: 'Build/docs.framework.js.unityweb',
      codeUrl: 'Build/docs.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Remember Me Team",
      productName: "Remember Me",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    const loader = document.createElement('script');
    loader.src = 'Build/docs.loader.js';
    loader.onerror = () => { loading.textContent = 'The game could not load. Refresh this page to try again.'; };
    loader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        loading.textContent = `Loading Remember Me… ${Math.round(100 * progress)}%`;
      }).then(() => {
        loading.hidden = true;
        canvas.focus({ preventScroll: true });
      }).catch((error) => {
        loading.textContent = 'The game could not start. Try a desktop browser with WebGL enabled.';
        console.error(error);
      });
    };
    canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));
    document.body.append(loader);
  </script>
</body>
</html>
